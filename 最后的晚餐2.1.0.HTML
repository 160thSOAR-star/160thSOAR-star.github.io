<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>滚木图像生成器｜优化改进版</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    background: #0b0c10;
}
canvas {
    image-rendering: pixelated;
}
input:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}
</style>
</head>
<body class="min-h-screen text-gray-100 font-sans px-4 py-8">
<div class="max-w-3xl mx-auto">
    <div class="bg-gray-800/70 backdrop-blur rounded-2xl shadow-2xl p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center mb-2">滚木图像生成器</h1>
        <p class="text-gray-400 text-sm text-center mb-6">理论上包含该分辨率下<strong>一切可能出现的图片</strong></p>
        <!-- 控制面板 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm text-gray-300 mb-1">画布尺寸</label>
                <select id="sizeSelect" class="w-full bg-gray-700 rounded-lg px-3 py-2.5 border border-gray-600">
                    <option value="512">512 × 512</option>
                    <option value="1024" selected>1024 × 1024</option>
                    <option value="256">256 × 256</option>
                    <option value="128">128 × 128（演示用）</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">生成模式</label>
                <select id="modeSelect" class="w-full bg-gray-700 rounded-lg px-3 py-2.5 border border-gray-600">
                    <option value="random">纯随机噪点（原版）</option>
                    <option value="mono">黑白随机噪点</option>
                    <option value="noise">平滑灰度噪声</option>
                    <option value="colorNoise">平滑彩色噪声</option>
                    <option value="fractal">分形灰度噪声</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm text-gray-300 mb-1">种子 Seed（相同种子复现图片，留空自动生成随机种子）</label>
                <div class="flex gap-2">
                    <input id="seedInput" type="text" class="flex-1 bg-gray-700 rounded-lg px-3 py-2.5 border border-gray-600" placeholder="输入数字或文本">
                    <button id="copySeedBtn" class="bg-gray-600 px-3 rounded-lg shrink-0">复制</button>
                </div>
                <div id="usedSeedTip" class="text-xs text-gray-400 mt-1"></div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">噪声缩放(仅噪声模式生效)</label>
                <input id="noiseScaleInput" type="number" value="12" min="2" max="64" class="w-full bg-gray-700 rounded-lg px-3 py-2.5 border border-gray-600">
            </div>
        </div>
        <!-- 按钮组 -->
        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button id="genBtn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-5 py-2.5 rounded-xl font-medium transition-all shadow-lg">
                重新生成
            </button>
            <button id="downloadBtn" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 px-5 py-2.5 rounded-xl font-medium transition-all shadow-lg">
                下载PNG
            </button>
        </div>
        <div id="loadingTip" class="text-amber-400 text-sm text-center hidden mb-2">正在生成图片，请稍候…</div>
        <div id="errorTip" class="text-red-400 text-sm text-center hidden mb-2"></div>
        <div id="iosTip" class="text-orange-300 text-xs text-center hidden mb-2">iOS提示：下载失败请长按画布保存图片</div>
        <!-- 画布区域 -->
        <div class="flex justify-center">
            <div id="canvasWrap" class="w-full max-w-md">
                <canvas id="randCanvas" class="w-full rounded-xl border border-gray-600 shadow-xl"></canvas>
            </div>
        </div>
        <!-- 统计信息 -->
        <div class="mt-6 bg-gray-900/60 rounded-xl p-4 text-sm text-gray-300">
            <div>画布尺寸：<span id="infoSize">1024 × 1024</span></div>
            <div>已生成次数：<span id="genCount">0</span></div>
            <div>生成耗时：<span id="timeCost">-</span> ms</div>
            <div class="mt-1 text-gray-400 text-xs">
                项目原理：通过随机算法生成一张完全随机的图片 它可能包括任何东西 但大都是无意义的
            </div>
        </div>
    </div>
    <div class="text-center text-gray-500 text-xs mt-4">仅供娱乐 | 纯前端项目｜优化重构版</div>
</div>
<script>
/**
 * 状态统一管理
 */
const AppState = {
    width: 1024,
    height: 1024,
    genCount: 0,
    maxSize: 2048,
    worker: null,
    isGenerating: false,
    reqId: 0,
    lastUsedSeed: ""
};

/** DOM元素缓存 */
const Dom = {
    canvas: document.getElementById('randCanvas'),
    ctx: document.getElementById('randCanvas').getContext('2d'),
    genBtn: document.getElementById('genBtn'),
    downloadBtn: document.getElementById('downloadBtn'),
    sizeSelect: document.getElementById('sizeSelect'),
    modeSelect: document.getElementById('modeSelect'),
    seedInput: document.getElementById('seedInput'),
    copySeedBtn: document.getElementById('copySeedBtn'),
    usedSeedTip: document.getElementById('usedSeedTip'),
    noiseScaleInput: document.getElementById('noiseScaleInput'),
    loadingTip: document.getElementById('loadingTip'),
    errorTip: document.getElementById('errorTip'),
    iosTip: document.getElementById('iosTip'),
    infoSize: document.getElementById('infoSize'),
    genCountEl: document.getElementById('genCount'),
    timeCostEl: document.getElementById('timeCost')
};

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
if(isIOS) Dom.iosTip.classList.remove('hidden');

/**
 * Worker 内联代码
 */
const WORKER_SOURCE = `
function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for(let i=0; i<str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = h << 13 | h >>> 19;
    }
    return function() {
        h = Math.imul(h ^ h >>> 16, 2246822507);
        h = Math.imul(h ^ h >>> 13, 3266489909);
        return (h ^= h >>> 16) >>> 0;
    }
}
function mulberry32(seed) {
    return function() {
        seed += 0x6D2B79F5;
        let t = seed;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}
function fade(t) { return t*t*t*(t*(t*6-15)+10); }
function lerp(a,b,t) { return a + (b-a)*t; }

class Perlin {
    constructor(randFn){
        this.rand = randFn;
        this.p = [];
        for(let i=0;i<256;i++) this.p[i]=i;
        for(let i=255;i>0;i--){
            const j = Math.floor(this.rand()*(i+1));
            [this.p[i],this.p[j]] = [this.p[j],this.p[i]];
        }
        for(let i=0;i<256;i++) this.p[256+i]=this.p[i];
    }
    grad(hash, x, y){
        const h = hash & 3;
        const u = h<2 ? x : y;
        const v = h<2 ? y : x;
        return ((h&1)===0 ? u:-u) + ((h&2)===0 ? v:-v);
    }
    noise(x,y){
        const X = Math.floor(x)&255;
        const Y = Math.floor(y)&255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        const u = fade(x);
        const v = fade(y);
        const aa = this.p[X]+Y;
        const ab = this.p[X]+Y+1;
        const ba = this.p[X+1]+Y;
        const bb = this.p[X+1]+Y+1;
        return lerp(
            lerp(this.grad(this.p[aa],x,y), this.grad(this.p[ba],x-1,y), u),
            lerp(this.grad(this.p[ab],x,y-1), this.grad(this.p[bb],x-1,y-1), u),
            v
        );
    }
    fbm(x,y, octaves=4){
        let total = 0;
        let amplitude = 1;
        let frequency =1;
        let maxValue=0;
        for(let i=0;i<octaves;i++){
            total += this.noise(x*frequency, y*frequency)*amplitude;
            maxValue += amplitude;
            amplitude *=0.5;
            frequency *=2;
        }
        return total/maxValue;
    }
}

self.onmessage = (e)=>{
    const {reqId, W,H,mode,seedText,noiseScale} = e.data;
    // 空文本也使用prng，不使用Math.random
    let finalSeedText = seedText.trim() || String(Math.random());
    const seeder = xmur3(finalSeedText);
    const rand = mulberry32(seeder());
    const perlin = new Perlin(rand);

    const buf = new Uint8ClampedArray(W*H*4);
    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
            const idx = (y*W+x)*4;
            let r,g,b;
            if(mode === "random"){
                r = Math.floor(rand()*256);
                g = Math.floor(rand()*256);
                b = Math.floor(rand()*256);
            }else if(mode === "mono"){
                const v = Math.floor(rand()*256);
                r=g=b=v;
            }else if(mode === "noise"){
                const n = perlin.noise(x/noiseScale, y/noiseScale);
                const v = Math.floor(((n+1)/2)*255);
                r=g=b=v;
            }else if(mode === "colorNoise"){
                const nr = perlin.noise(x/noiseScale, y/noiseScale);
                const ng = perlin.noise((x+100)/noiseScale, (y+100)/noiseScale);
                const nb = perlin.noise((x+200)/noiseScale, (y+200)/noiseScale);
                r = Math.floor(((nr+1)/2)*255);
                g = Math.floor(((ng+1)/2)*255);
                b = Math.floor(((nb+1)/2)*255);
            }else if(mode === "fractal"){
                const n = perlin.fbm(x/noiseScale, y/noiseScale);
                const v = Math.floor(((n+1)/2)*255);
                r=g=b=v;
            }
            buf[idx]=r;
            buf[idx+1]=g;
            buf[idx+2]=b;
            buf[idx+3]=255;
        }
    }
    self.postMessage({reqId, buf,W,H, usedSeed: finalSeedText}, [buf.buffer]);
}
`;

let workerBlobUrl = null;
/**
 * Worker初始化，全局复用
 */
function initWorker(){
    if(AppState.worker) return AppState.worker;
    const blob = new Blob([WORKER_SOURCE], {type:"application/javascript"});
    workerBlobUrl = URL.createObjectURL(blob);
    AppState.worker = new Worker(workerBlobUrl);
    AppState.worker.onmessage = (evt)=>{
        const {reqId, buf,W,H, usedSeed} = evt.data;
        // 丢弃过期旧请求返回数据
        if(reqId !== AppState.reqId){
            return;
        }
        const imgData = new ImageData(buf,W,H);
        Dom.ctx.putImageData(imgData,0,0);
        AppState.lastUsedSeed = usedSeed;
        Dom.usedSeedTip.textContent = `本次使用种子：${usedSeed.substring(0,60)}${usedSeed.length>60?"…":""}`;
        AppState.genCount +=1;
        Dom.genCountEl.textContent = AppState.genCount;
        const end = performance.now();
        Dom.timeCostEl.textContent = Math.round(end - startTime);

        AppState.isGenerating = false;
        Dom.genBtn.disabled = false;
        showLoading(false);
    };
    AppState.worker.onerror = (err)=>{
        showError("Worker运行异常：" + err.message);
        AppState.isGenerating = false;
        Dom.genBtn.disabled = false;
        showLoading(false);
    };
    return AppState.worker;
}

/**
 * 设置画布尺寸
 */
function setupCanvas(){
    const sz = parseInt(Dom.sizeSelect.value,10);
    const safeSize = Math.min(sz, AppState.maxSize);
    AppState.width = safeSize;
    AppState.height = safeSize;
    Dom.canvas.width = AppState.width;
    Dom.canvas.height = AppState.height;
    Dom.infoSize.textContent = `${AppState.width} × ${AppState.height}`;
}

/** 同步UI：噪声缩放输入框是否可用 */
function syncModeUi(){
    const mode = Dom.modeSelect.value;
    const noiseModes = ["noise","colorNoise","fractal"];
    Dom.noiseScaleInput.disabled = !noiseModes.includes(mode);
}

/**
 * 显示/隐藏提示
 */
function showLoading(show){
    if(show){
        Dom.loadingTip.classList.remove('hidden');
    }else{
        Dom.loadingTip.classList.add('hidden');
    }
}
function showError(msg){
    if(!msg){
        Dom.errorTip.classList.add('hidden');
        Dom.errorTip.textContent = "";
        return;
    }
    Dom.errorTip.textContent = msg;
    Dom.errorTip.classList.remove('hidden');
}

let startTime = 0;
/**
 * 核心生成逻辑
 */
async function generateImage(){
    if(AppState.isGenerating) return;
    showError("");
    AppState.isGenerating = true;
    Dom.genBtn.disabled = true;
    showLoading(true);
    startTime = performance.now();
    const worker = initWorker();
    let noiseScale = Number(Dom.noiseScaleInput.value) || 12;
    noiseScale = Math.max(2, Math.min(64, noiseScale));
    AppState.reqId +=1;
    worker.postMessage({
        reqId: AppState.reqId,
        W: AppState.width,
        H: AppState.height,
        mode: Dom.modeSelect.value,
        seedText: Dom.seedInput.value,
        noiseScale: noiseScale
    });
}

/**
 * 下载图片
 */
async function downloadImage(){
    try{
        const blob = await new Promise(resolve=>Dom.canvas.toBlob(resolve,"image/png"));
        if(!blob) throw new Error("导出blob失败");
        const link = document.createElement('a');
        link.download = `rollwood_${AppState.width}_${Date.now()}.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
    }catch(e){
        showError("下载失败，iOS请长按画布保存");
    }
}

async function copyCurrentSeed(){
    try{
        await navigator.clipboard.writeText(AppState.lastUsedSeed);
        alert("种子已复制到剪贴板");
    }catch(){
        Dom.seedInput.value = AppState.lastUsedSeed;
        Dom.seedInput.select();
        alert("无法剪贴板，已填入输入框，请手动复制");
    }
}

/** 绑定事件 */
function bindEvents(){
    Dom.genBtn.addEventListener('click', ()=>generateImage());
    Dom.downloadBtn.addEventListener('click', ()=>downloadImage());
    Dom.copySeedBtn.addEventListener('click', copyCurrentSeed);
    Dom.sizeSelect.addEventListener('change', async ()=>{
        setupCanvas();
        await generateImage();
    });
    Dom.modeSelect.addEventListener('change', ()=>{
        syncModeUi();
        generateImage();
    });
    // 页面卸载释放资源
    window.addEventListener('beforeunload', ()=>{
        if(AppState.worker) AppState.worker.terminate();
        if(workerBlobUrl) URL.revokeObjectURL(workerBlobUrl);
    });
}

// 初始化入口
(function bootstrap(){
    setupCanvas();
    syncModeUi();
    bindEvents();
    generateImage();
})();
</script>
</body>
</html>
